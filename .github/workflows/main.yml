name: Generate Random Data CSV

on:
  # 1. 수동으로 실행하고 싶을 때 버튼 활성화
  workflow_dispatch:
  
  # 2. 주기적으로 자동 실행하고 싶을 때 (예: 매일 자정 실행)
  # 주석(#)을 해제하면 활성화됩니다. 미동작 시 분/시 설정을 확인하세요.
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 리포지토리에 파일을 푸시하기 위해 쓰기 권한 허용

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with-version: '3.10'

    - name: Generate Random CSV
      run: |
        python -c "
        import random
        import csv

        # nd-랜덤숫자 형식으로 30개 생성 (예: nd-45)
        data = [[f'nd-{random.randint(1, 100)}'] for _ in range(30)]

        # data.csv 파일로 저장
        with open('data.csv', 'w', newline='', encoding='utf-8') as f:
            writer = csv.writer(f)
            writer.writerow(['ID']) # 헤더 열 이름
            writer.writerows(data)
        print('CSV 파일 생성 완료!')
        "

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.csv
        # 변경 사항이 있을 때만 커밋 및 푸시
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update random data CSV" && git push)
